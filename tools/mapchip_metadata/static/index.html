<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DA ZERO — Map Chip Metadata</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="editor-header.css">
</head>
<body>
  <header class="app-header">
    <div class="header-identity">
      <div class="brand">
        <div>
          <h1>Map Chip Metadata</h1>
        </div>
      </div>
      <nav id="editor-switch" class="editor-switch" aria-label="エディタ切り替え" hidden>
        <a data-editor-link="tileset" aria-current="page">マップチップ</a>
        <a data-editor-link="map">マップ</a>
        <a data-editor-link="event">イベント</a>
      </nav>
    </div>
    <div class="editor-context" aria-label="編集対象タイルセット">
      <label for="tileset-select">タイルセット</label>
      <select id="tileset-select" disabled></select>
      <button id="new-tileset-button" class="button ghost" type="button">新規タイルセット</button>
    </div>
    <div class="toolbar">
      <span id="save-state" class="status-pill">読み込み中</span>
      <button id="undo-button" class="button ghost" type="button" disabled>元に戻す</button>
      <button id="redo-button" class="button ghost" type="button" disabled>やり直す</button>
      <button id="save-button" class="button primary" type="button" disabled>保存</button>
    </div>
  </header>

  <main class="workspace">
    <section class="source-panel panel">
      <div class="panel-heading">
        <div>
          <h2>ソース画像</h2>
          <p id="image-summary">—</p>
        </div>
        <div class="source-controls">
          <div class="zoom-controls" aria-label="ズーム">
            <button id="zoom-out" class="icon-button" type="button" title="縮小">−</button>
            <span id="zoom-label">3×</span>
            <button id="zoom-in" class="icon-button" type="button" title="拡大">＋</button>
          </div>
          <button id="delete-tileset-button" class="button danger small" type="button">タイルセット削除</button>
        </div>
      </div>
      <div class="transparency-note">
        <span class="transparency-swatch" aria-hidden="true"></span>
        透過色 <code>#FF0080</code> を透明表示
      </div>
      <div class="usage-legend" aria-label="ソースチップ使用状況">
        <span><i class="usage-dot ground"></i>地面</span>
        <span><i class="usage-dot boundary"></i>境界</span>
        <span><i class="usage-dot object"></i>オブジェクト</span>
        <span><i class="usage-dot unused"></i>未使用</span>
        <strong id="usage-summary">—</strong>
      </div>
      <div id="source-scroll" class="canvas-scroll">
        <canvas id="source-canvas" aria-label="マップチップ画像"></canvas>
      </div>
      <div class="selection-readout">
        <span>選択</span>
        <strong id="selection-label">[0, 0] 1×1</strong>
        <span class="hint">ドラッグで矩形選択</span>
      </div>
    </section>

    <section class="editor-panel panel">
      <nav class="tabs" aria-label="編集対象">
        <button class="tab active" data-tab="ground" type="button">地面</button>
        <button class="tab" data-tab="boundary" type="button">境界</button>
        <button class="tab" data-tab="object" type="button">オブジェクト</button>
      </nav>
      <div id="editor-content" class="editor-content"></div>
    </section>

    <aside class="preview-panel panel">
      <div class="panel-heading compact">
        <div>
          <h2>プレビュー</h2>
          <p>60fps基準</p>
        </div>
        <div class="preview-controls">
          <label class="preview-collision-toggle">
            <input id="preview-collision" type="checkbox">
            通行判定を枠表示
          </label>
          <button id="preview-pause" class="button ghost small" type="button">一時停止</button>
        </div>
      </div>
      <div id="preview-content" class="preview-content"></div>

      <div class="issues-heading">
        <h2>問題一覧</h2>
        <span id="issue-count" class="count-badge">0</span>
      </div>
      <div id="issues" class="issues" aria-live="polite"></div>
    </aside>
  </main>

  <dialog id="new-tileset-dialog" class="resource-dialog" aria-labelledby="new-tileset-dialog-title">
    <form id="new-tileset-form" method="dialog" class="resource-dialog-content">
      <h2 id="new-tileset-dialog-title">新規タイルセット</h2>
      <div class="form-grid">
        <div class="field full"><label>タイルセットID</label><input id="new-tileset-id" type="text" pattern="[a-z][a-z0-9_]*" required></div>
        <div class="field full"><label>ソース画像</label><select id="new-tileset-source" required></select></div>
        <div class="field full"><label>profile</label><select id="new-tileset-profile"><option value="town">town（集落）</option><option value="dungeon">dungeon（戦闘マップ）</option><option value="world">world</option></select></div>
        <div class="field"><label>ベース地面ID</label><input id="new-tileset-base-id" type="text" pattern="[a-z][a-z0-9_]*" value="base" required></div>
        <div class="field"><label>ベース地面の通行</label><select id="new-tileset-base-collision"><option value="blocked">通行不可</option><option value="passable">通行可</option></select></div>
      </div>
      <div class="dialog-actions"><button class="button ghost" type="button" data-action="close-new-tileset-dialog">キャンセル</button><button class="button primary" type="submit">作成</button></div>
    </form>
  </dialog>

  <dialog id="unsaved-navigation-dialog" class="resource-dialog" aria-labelledby="unsaved-navigation-dialog-title">
    <div class="resource-dialog-content">
      <h2 id="unsaved-navigation-dialog-title">未保存の変更があります</h2>
      <p>変更を保存してからエディタを切り替えますか？</p>
      <div class="dialog-actions">
        <button class="button ghost" type="button" data-navigation-choice="cancel">キャンセル</button>
        <button class="button danger" type="button" data-navigation-choice="discard">変更を破棄して移動</button>
        <button class="button primary" type="button" data-navigation-choice="save">保存して移動</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
