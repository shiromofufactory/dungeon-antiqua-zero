<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DA ZERO — Map Editor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">DA0</span>
      <div><h1>Map Editor</h1><p id="document-path">読み込み中…</p></div>
    </div>
    <div class="toolbar">
      <span id="save-state" class="status-pill">読み込み中</span>
      <button id="undo-button" class="button ghost" type="button" disabled>元に戻す</button>
      <button id="redo-button" class="button ghost" type="button" disabled>やり直す</button>
      <button id="validate-button" class="button secondary" type="button">検証</button>
      <button id="save-button" class="button primary" type="button">保存・生成</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="palette-panel panel">
      <nav class="tabs" aria-label="配置対象">
        <button class="tab active" data-tab="ground" type="button">地面</button>
        <button class="tab" data-tab="object" type="button">オブジェクト</button>
      </nav>
      <div id="palette-content" class="palette-content"></div>
    </aside>

    <section class="map-panel panel">
      <div class="panel-heading map-heading">
        <div><h2 id="map-title">マップ</h2><p id="map-summary">—</p></div>
        <div class="map-controls">
          <label><input id="grid-toggle" type="checkbox" checked> グリッド</label>
          <label><input id="collision-toggle" type="checkbox"> 通行不可</label>
          <button id="zoom-out" class="icon-button" type="button" title="縮小">−</button>
          <span id="zoom-label">2×</span>
          <button id="zoom-in" class="icon-button" type="button" title="拡大">＋</button>
          <button id="animation-toggle" class="button ghost small" type="button">一時停止</button>
        </div>
      </div>
      <div id="map-scroll" class="map-scroll">
        <canvas id="map-canvas" aria-label="マップ編集キャンバス"></canvas>
      </div>
      <div class="map-status">
        <span id="cursor-status">セル —</span>
        <span id="tool-status">地面を選択してください</span>
      </div>
    </section>

    <aside class="inspector-panel panel">
      <div id="inspector-content"></div>
      <div class="issues-heading"><h2>問題一覧</h2><span id="issue-count" class="count-badge">0</span></div>
      <div id="issues" class="issues" aria-live="polite"></div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
